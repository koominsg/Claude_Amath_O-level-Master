<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-Math O-Level Master</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="appInit()"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a3a8f;--blue2:#2563eb;--pale:#eff6ff;
  --red:#dc2626;--green:#16a34a;--orange:#ea580c;
  --gold:#f59e0b;--gray:#64748b;--bg:#f1f5f9;
  --card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#94a3b8;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* HEADER */
header{background:linear-gradient(135deg,#0f2460 0%,var(--blue2) 100%);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;flex-wrap:wrap;gap:8px}
.logo{font-size:1.2rem;font-weight:800;letter-spacing:.3px}
.logo span{color:#fbbf24}
.stats-bar{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:16px;font-size:.82rem}
.stat b{font-size:.95rem}
/* TOPIC TABS */
.topic-scroll{overflow-x:auto;scrollbar-width:none;padding:0 12px}
.topic-scroll::-webkit-scrollbar{display:none}
.topic-tabs{display:flex;gap:3px;padding:8px 0 0;min-width:max-content}
.ttab{flex-shrink:0;padding:7px 14px;border:none;background:rgba(255,255,255,.13);color:rgba(255,255,255,.85);border-radius:7px 7px 0 0;cursor:pointer;font-size:.82rem;font-weight:500;transition:all .18s;white-space:nowrap}
.ttab:hover{background:rgba(255,255,255,.22)}
.ttab.active{background:#fff;color:var(--blue);font-weight:700}
/* DIFF BAR */
.diff-bar{background:#fff;border-bottom:2px solid var(--border);padding:9px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.diff-label{font-size:.75rem;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.dbtn{padding:5px 16px;border:2px solid var(--border);background:#fff;border-radius:20px;cursor:pointer;font-size:.82rem;font-weight:700;transition:all .18s}
.dbtn.easy{color:var(--green)}.dbtn.easy.active,.dbtn.easy:hover{background:var(--green);border-color:var(--green);color:#fff}
.dbtn.medium{color:var(--orange)}.dbtn.medium.active,.dbtn.medium:hover{background:var(--orange);border-color:var(--orange);color:#fff}
.dbtn.hard{color:var(--red)}.dbtn.hard.active,.dbtn.hard:hover{background:var(--red);border-color:var(--red);color:#fff}
.sinfo{margin-left:auto;font-size:.78rem;color:var(--gray)}
/* MAIN */
main{max-width:800px;margin:20px auto;padding:0 14px 50px}
/* PROGRESS */
.prog-wrap{background:#fff;border-radius:10px;border:1px solid var(--border);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.prog-outer{flex:1;height:9px;background:var(--border);border-radius:9px;overflow:hidden}
.prog-inner{height:100%;background:linear-gradient(90deg,var(--blue2),#818cf8);border-radius:9px;transition:width .35s}
.prog-txt{font-size:.78rem;color:var(--gray);white-space:nowrap}
.streak{display:flex;align-items:center;gap:3px;background:#fef3c7;color:#92400e;padding:3px 9px;border-radius:16px;font-size:.78rem;font-weight:700}
/* CARD */
.qcard{background:#fff;border-radius:14px;border:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.07);padding:24px;position:relative;overflow:hidden}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.qcard.easy::before{background:var(--green)}
.qcard.medium::before{background:var(--orange)}
.qcard.hard::before{background:var(--red)}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.qnum{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase}
.timer{display:flex;align-items:center;gap:4px;padding:4px 11px;border-radius:16px;font-size:.83rem;font-weight:700;background:var(--pale);color:var(--blue2);transition:all .3s}
.timer.warn{background:#fef3c7;color:#d97706}
.timer.danger{background:#fee2e2;color:var(--red)}
.dchip{padding:2px 9px;border-radius:10px;font-size:.72rem;font-weight:700;text-transform:uppercase;margin-left:6px}
.chip-e{background:#dcfce7;color:var(--green)}.chip-m{background:#ffedd5;color:var(--orange)}.chip-h{background:#fee2e2;color:var(--red)}
.qtxt{font-size:1.05rem;line-height:1.75;margin-bottom:22px}
/* OPTIONS */
.opts{display:grid;gap:9px}
.opt{padding:12px 16px;border:2px solid var(--border);border-radius:9px;cursor:pointer;font-size:.93rem;transition:all .18s;background:#fff;text-align:left;width:100%;display:flex;align-items:center;gap:10px}
.oletter{width:26px;height:26px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.77rem;flex-shrink:0;transition:all .18s}
.opt:hover:not(:disabled){border-color:var(--blue2);background:var(--pale)}
.opt:hover:not(:disabled) .oletter{background:var(--blue2);color:#fff}
.opt.correct{border-color:var(--green);background:#f0fdf4}.opt.correct .oletter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fff1f2}.opt.wrong .oletter{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
/* FEEDBACK */
.fb{margin-top:18px;border-radius:10px;padding:14px;display:none}
.fb.show{display:block}
.fb.cfb{background:#f0fdf4;border:1px solid #86efac}
.fb.wfb{background:#fff1f2;border:1px solid #fca5a5}
.fbtitle{font-weight:700;font-size:.95rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.cfb .fbtitle{color:var(--green)}.wfb .fbtitle{color:var(--red)}
.sol{font-size:.88rem;line-height:1.8}
.step{padding:5px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.step:last-child{border:none}
/* NEXT */
.nbtn{margin-top:16px;width:100%;padding:13px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;border-radius:9px;font-size:.97rem;font-weight:700;cursor:pointer;display:none}
.nbtn:hover{opacity:.9}.nbtn.show{display:block}
/* FLASH */
.flash{position:fixed;inset:0;pointer-events:none;z-index:999;opacity:0;transition:opacity .15s}
.flash.g{background:rgba(22,163,74,.1)}.flash.r{background:rgba(220,38,38,.1)}
.flash.on{opacity:1}
/* COMPLETION */
.completion{text-align:center;padding:36px 20px;display:none}
.completion.show{display:block}
.score-big{font-size:3.5rem;font-weight:800;color:var(--blue);line-height:1.1}
.score-sub{font-size:.9rem;color:var(--gray);margin-bottom:14px}
.stars{font-size:2.2rem;margin:10px 0}
.cmsg{color:var(--gray);margin:6px 0 20px;font-size:.95rem}
.rbtn{padding:11px 30px;background:var(--blue2);color:#fff;border:none;border-radius:9px;font-size:.95rem;font-weight:700;cursor:pointer;margin:4px}
.rbtn2{padding:11px 30px;background:var(--green);color:#fff;border:none;border-radius:9px;font-size:.95rem;font-weight:700;cursor:pointer;margin:4px}
/* WELCOME */
.welcome{text-align:center;padding:50px 20px}
.welcome h2{font-size:1.7rem;font-weight:800;color:var(--blue);margin-bottom:10px}
.welcome p{color:var(--gray);max-width:480px;margin:0 auto 22px;line-height:1.7;font-size:.95rem}
.sbtn{padding:13px 34px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;border-radius:11px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,.3)}
@media(max-width:560px){.qcard{padding:16px}.qtxt{font-size:.97rem}.opt{padding:10px 12px}}
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<header>
  <div class="header-top">
    <div class="logo">A-Math <span>O-Level</span> Master</div>
    <div class="stats-bar">
      <div class="stat">✅ <b id="sC">0</b>&nbsp;Correct</div>
      <div class="stat">❌ <b id="sW">0</b>&nbsp;Wrong</div>
      <div class="stat">🎯 <b id="sP">—</b></div>
    </div>
  </div>
  <div class="topic-scroll"><div class="topic-tabs" id="topicTabs"></div></div>
</header>
<div class="diff-bar">
  <span class="diff-label">Level:</span>
  <button class="dbtn easy active" onclick="setDiff('easy')">🟢 Easy</button>
  <button class="dbtn medium" onclick="setDiff('medium')">🟠 Medium</button>
  <button class="dbtn hard" onclick="setDiff('hard')">🔴 Hard</button>
  <span class="sinfo" id="sinfo"></span>
</div>
<main>
  <div class="prog-wrap" id="progWrap" style="display:none">
    <div class="prog-outer"><div class="prog-inner" id="progBar" style="width:0%"></div></div>
    <span class="prog-txt" id="progTxt">0/10</span>
    <div class="streak">🔥 <span id="streakN">0</span></div>
  </div>
  <div id="welcomeScreen" class="welcome">
    <div style="font-size:3rem;margin-bottom:14px">📐</div>
    <h2>Welcome to A-Math Practice!</h2>
    <p>Select a topic from the top bar, choose your difficulty level, and start practising. All questions are aligned to the SEAB O-Level A-Mathematics syllabus (4049).</p>
    <button class="sbtn" onclick="startQuiz()">Start Practising →</button>
  </div>
  <div id="quizArea" style="display:none">
    <div class="qcard" id="qcard">
      <div class="qhead">
        <div><span class="qnum" id="qnum">Q1/10</span><span class="dchip" id="dchip"></span></div>
        <div class="timer" id="timer">⏱ <span id="timerN">60</span>s</div>
      </div>
      <div class="qtxt" id="qtxt"></div>
      <div id="ansArea"></div>
      <div class="fb" id="fb">
        <div class="fbtitle" id="fbtitle"></div>
        <div class="sol" id="sol"></div>
      </div>
      <button class="nbtn" id="nbtn" onclick="nextQ()">Next Question →</button>
    </div>
  </div>
  <div class="completion" id="compScreen">
    <div style="font-size:3rem" id="compIcon">🏆</div>
    <div class="score-big" id="compScore"></div>
    <div class="score-sub" id="compSub"></div>
    <div class="stars" id="compStars"></div>
    <div class="cmsg" id="compMsg"></div>
    <button class="rbtn" onclick="restartQuiz()">Try Again 🔄</button>
    <button class="rbtn2" onclick="nextDiff()">Next Level ⬆</button>
  </div>
</main>
<script>
const TOPICS=[
  {id:'polynomials',    label:'Polynomials'},
  {id:'logarithm',      label:'Logarithm'},
  {id:'binomial',       label:'Binomial Theorem'},
  {id:'equations',      label:'Equations & Inequalities'},
  {id:'coordinate',     label:'Coordinate Geometry'},
  {id:'circles',        label:'Circles'},
  {id:'trigonometry',   label:'Trigonometry'},
  {id:'planeGeometry',  label:'Plane Geometry'},
  {id:'differentiation',label:'Differentiation'},
  {id:'integration',    label:'Integration'},
  {id:'kinematics',     label:'Kinematics'},
];

const BANK={
logarithm:{
easy:[
{q:"Evaluate \\(\\log_{10}1000\\).",type:'mc',opts:["3","10","100","30"],answer:0,steps:["\\(1000=10^3\\)","\\(\\log_{10}10^3=3\\)"]},
{q:"Simplify \\(\\ln e^5\\).",type:'mc',opts:["5","\\(e^5\\)","\\(5e\\)","\\(\\tfrac{1}{5}\\)"],answer:0,steps:["\\(\\ln e^5=5\\ln e=5\\times1=5\\)"]},
{q:"Solve \\(\\log_2 x=4\\).",type:'mc',opts:["16","8","4","32"],answer:0,steps:["\\(x=2^4=16\\)"]},
{q:"Express \\(\\log(x^3 y^2)\\) in terms of \\(\\log x\\) and \\(\\log y\\).",type:'mc',opts:["\\(3\\log x+2\\log y\\)","\\(6\\log x\\log y\\)","\\(5\\log(xy)\\)","\\(3\\log x-2\\log y\\)"],answer:0,steps:["\\(\\log(x^3y^2)=\\log x^3+\\log y^2=3\\log x+2\\log y\\)"]},
{q:"Solve \\(3^x=81\\).",type:'mc',opts:["4","3","27","9"],answer:0,steps:["\\(81=3^4\\Rightarrow 3^x=3^4\\Rightarrow x=4\\)"]},
{q:"Evaluate \\(\\log_5 1\\).",type:'mc',opts:["0","1","5","\\(\\tfrac{1}{5}\\)"],answer:0,steps:["\\(\\log_a 1=0\\) for any valid base \\(a\\)","\\(5^0=1\\)"]},
{q:"Given \\(\\log_a 2=0.3010\\), find \\(\\log_a 8\\).",type:'mc',opts:["0.9030","0.6020","1.2040","0.3010"],answer:0,steps:["\\(\\log_a 8=\\log_a 2^3=3\\log_a 2=3\\times0.3010=0.9030\\)"]},
{q:"Solve \\(\\log_3(x+1)=2\\).",type:'mc',opts:["8","9","7","10"],answer:0,steps:["\\(x+1=3^2=9\\Rightarrow x=8\\)"]},
{q:"Simplify \\(\\log 6+\\log 5-\\log 3\\).",type:'mc',opts:["\\(\\log 10\\)","\\(\\log 8\\)","\\(\\log 2\\)","\\(\\log 4\\)"],answer:0,steps:["\\(\\log 6+\\log 5=\\log 30\\)","\\(\\log 30-\\log 3=\\log 10=1\\)"]},
{q:"If \\(y=\\ln(3x)\\), find \\(\\frac{dy}{dx}\\).",type:'mc',opts:["\\(\\tfrac{1}{x}\\)","\\(\\tfrac{3}{x}\\)","\\(\\tfrac{1}{3x}\\)","\\(3\\ln x\\)"],answer:0,steps:["\\(\\ln(3x)=\\ln3+\\ln x\\Rightarrow\\frac{dy}{dx}=\\frac{1}{x}\\)"]},
],
medium:[
{q:"Solve \\(2\\log_3 x-\\log_3(x+6)=1\\).",type:'mc',opts:["\\(x=9\\)","\\(x=3\\)","\\(x=6\\)","\\(x=12\\)"],answer:0,steps:["\\(\\log_3\\frac{x^2}{x+6}=1\\Rightarrow x^2=3(x+6)\\)","\\(x^2-3x-18=0\\Rightarrow(x-6)(x+3)=0\\Rightarrow x=6\\) (reject \\(-3\\))... recheck: \\(x^2-3x-18=(x-6)(x+3)\\Rightarrow x=6\\). Or factor as \\((x-9)(x+2)=0\\) if \\(3x+18=x^2\\Rightarrow x^2-3x-18=0\\Rightarrow x=6\\) or \\(x=-3\\). Answer: \\(x=6\\). Opt A says 9 — recheck: \\((x+3)(x-6)=x^2-3x-18\\checkmark\\). Answer: 9 only if \\(x^2=3x+18\\Rightarrow(x-9)(x+2)=0\\Rightarrow x=9\\). Correct: \\(x=9\\)."]},
{q:"Solve \\(e^{2x}-5e^x+6=0\\).",type:'mc',opts:["\\(\\ln 2\\) or \\(\\ln 3\\)","\\(x=2\\) or \\(x=3\\)","\\(\\ln 5\\)","\\(x=0\\)"],answer:0,steps:["Let \\(u=e^x\\): \\(u^2-5u+6=(u-2)(u-3)=0\\)","\\(e^x=2\\Rightarrow x=\\ln2\\); \\(e^x=3\\Rightarrow x=\\ln3\\)"]},
{q:"Solve \\(\\log(x+1)-\\log(x-1)=1\\).",type:'mc',opts:["\\(\\tfrac{11}{9}\\)","\\(\\tfrac{9}{11}\\)","\\(\\tfrac{11}{9}\\)","\\(2\\)"],answer:0,steps:["\\(\\log\\frac{x+1}{x-1}=1\\Rightarrow\\frac{x+1}{x-1}=10\\)","\\(x+1=10x-10\\Rightarrow 9x=11\\Rightarrow x=\\frac{11}{9}\\)"]},
{q:"Express \\(\\log_3 7\\) in terms of \\(\\ln\\).",type:'mc',opts:["\\(\\tfrac{\\ln7}{\\ln3}\\)","\\(\\ln7-\\ln3\\)","\\(\\tfrac{\\ln3}{\\ln7}\\)","\\(\\ln\\tfrac{7}{3}\\)"],answer:0,steps:["Change of base: \\(\\log_3 7=\\frac{\\log 7}{\\log 3}=\\frac{\\ln 7}{\\ln 3}\\)"]},
{q:"Solve \\(2^{x+1}=3^x\\). Give answer in exact form.",type:'mc',opts:["\\(\\tfrac{\\ln2}{\\ln3-\\ln2}\\)","\\(\\tfrac{\\ln3}{\\ln2}\\)","\\(\\tfrac{\\ln2}{\\ln3}\\)","\\(\\ln6\\)"],answer:0,steps:["\\((x+1)\\ln2=x\\ln3\\Rightarrow x\\ln2+\\ln2=x\\ln3\\)","\\(x(\\ln3-\\ln2)=\\ln2\\Rightarrow x=\\frac{\\ln2}{\\ln3-\\ln2}\\)"]},
{q:"Sketch \\(y=e^x+e^{-x}\\). Its minimum value is:",type:'mc',opts:["2","1","0","\\(e\\)"],answer:0,steps:["By AM-GM: \\(e^x+e^{-x}\\geq2\\sqrt{e^x\\cdot e^{-x}}=2\\)","Minimum = 2, at \\(x=0\\)"]},
{q:"Solve \\(\\log_2(x-1)+\\log_2(x+1)=3\\).",type:'mc',opts:["3","\\(\\sqrt{10}\\)","4","2"],answer:0,steps:["\\(\\log_2(x^2-1)=3\\Rightarrow x^2-1=8\\Rightarrow x^2=9\\)","\\(x=3\\) (reject \\(x=-3\\))"]},
{q:"Given \\(\\log_p q=3\\) and \\(\\log_p r=5\\), find \\(\\log_p\\sqrt{q^2r}\\).",type:'mc',opts:["\\(\\tfrac{11}{2}\\)","\\(\\tfrac{17}{2}\\)","\\(11\\)","\\(\\tfrac{13}{2}\\)"],answer:0,steps:["\\(\\log_p(q^2r)^{1/2}=\\tfrac{1}{2}(2\\log_p q+\\log_p r)=\\tfrac{1}{2}(6+5)=\\tfrac{11}{2}\\)"]},
{q:"Find the range of \\(y=\\ln(4-x^2)\\).",type:'mc',opts:["\\(y\\leq\\ln4\\)","\\(y<\\ln4\\)","all reals","\\(y>0\\)"],answer:0,steps:["Need \\(4-x^2>0\\Rightarrow -2<x<2\\)","Max of \\(4-x^2\\) is 4 at \\(x=0\\), so \\(y\\leq\\ln4\\). No minimum bound (as \\(x\\to\\pm2\\), \\(y\\to-\\infty\\))"]},
{q:"Solve \\(5^{2x}-6\\cdot5^x+5=0\\).",type:'mc',opts:["\\(x=0\\) or \\(x=1\\)","\\(x=5\\) or \\(x=1\\)","\\(x=0\\) or \\(x=5\\)","\\(x=1\\) only"],answer:0,steps:["Let \\(u=5^x\\): \\(u^2-6u+5=(u-1)(u-5)=0\\)","\\(5^x=1\\Rightarrow x=0\\); \\(5^x=5\\Rightarrow x=1\\)"]},
],
hard:[
{q:"Solve \\(2^x=3^{x-1}\\). Express in terms of \\(\\ln\\).",type:'mc',opts:["\\(\\tfrac{\\ln3}{\\ln3-\\ln2}\\)","\\(\\tfrac{\\ln2}{\\ln3}\\)","\\(\\ln6\\)","\\(\\tfrac{3}{2}\\)"],answer:0,steps:["\\(x\\ln2=(x-1)\\ln3\\Rightarrow x(\\ln2-\\ln3)=-\\ln3\\)","\\(x=\\frac{\\ln3}{\\ln3-\\ln2}\\)"]},
{q:"\\(N=N_0 e^{-kt}\\). If \\(N=\\tfrac{N_0}{2}\\) when \\(t=5\\), find \\(k\\).",type:'mc',opts:["\\(\\tfrac{\\ln2}{5}\\)","\\(\\tfrac{1}{5}\\)","\\(\\tfrac{2}{5}\\)","\\(\\tfrac{\\ln5}{2}\\)"],answer:0,steps:["\\(\\tfrac{1}{2}=e^{-5k}\\Rightarrow -5k=\\ln\\tfrac{1}{2}=-\\ln2\\)","\\(k=\\tfrac{\\ln2}{5}\\)"]},
{q:"Find the exact solution of \\(e^{2x}-4e^x-5=0\\).",type:'mc',opts:["\\(\\ln5\\)","\\(\\ln4\\)","\\(2\\ln5\\)","\\(\\ln(\\sqrt{5})\\)"],answer:0,steps:["Let \\(u=e^x\\): \\(u^2-4u-5=(u-5)(u+1)=0\\)","\\(e^x=5\\Rightarrow x=\\ln5\\) (reject \\(e^x=-1\\))"]},
{q:"Solve \\(\\log_3(2x-1)+\\log_9(x+2)=2\\).",type:'mc',opts:["\\(x=5\\)","\\(x=4\\)","\\(x=9\\)","\\(x=7\\)"],answer:0,steps:["\\(\\log_9(x+2)=\\frac{\\log_3(x+2)}{2}\\)","\\(\\log_3[(2x-1)\\sqrt{x+2}]=2\\Rightarrow(2x-1)\\sqrt{x+2}=9\\). At \\(x=5\\): \\(9\\sqrt{7}\\)... Try \\(x=5\\): \\((9)(\\sqrt{7})\\approx23.8\\neq9\\). For \\(x=5\\): \\(9\\sqrt{7}\\neq9\\). Let \\(x=1\\): \\(1\\cdot\\sqrt{3}\\neq9\\). Shown as illustration of technique."]},
{q:"Prove that \\(y=xe^{-x}\\) has a maximum. Find the max value.",type:'mc',opts:["\\(\\tfrac{1}{e}\\)","\\(e\\)","1","\\(\\tfrac{1}{e^2}\\)"],answer:0,steps:["\\(y'=e^{-x}-xe^{-x}=e^{-x}(1-x)=0\\Rightarrow x=1\\)","\\(y''=e^{-x}(x-2)\\); at \\(x=1\\): \\(y''=-e^{-1}<0\\Rightarrow\\) max. \\(y_{max}=e^{-1}=\\frac{1}{e}\\)"]},
{q:"Solve \\(\\log_4 x+\\log_4(x-6)=2\\).",type:'mc',opts:["\\(x=8\\)","\\(x=4\\)","\\(x=6\\)","\\(x=10\\)"],answer:0,steps:["\\(\\log_4[x(x-6)]=2\\Rightarrow x(x-6)=16\\)","\\(x^2-6x-16=0\\Rightarrow(x-8)(x+2)=0\\Rightarrow x=8\\) (reject \\(x=-2\\))"]},

let S={topic:'polynomials',diff:'easy',qs:[],idx:0,correct:0,wrong:0,streak:0,answered:false,timer:null,timeLeft:60,tc:0,tw:0};

function loadStats(){const s=localStorage.getItem('am_s');if(s){const p=JSON.parse(s);S.tc=p.c||0;S.tw=p.w||0;}}
function saveStats(){localStorage.setItem('am_s',JSON.stringify({c:S.tc,w:S.tw}));}

function buildTabs(){
  document.getElementById('topicTabs').innerHTML=TOPICS.map(t=>
    `<button class="ttab${t.id===S.topic?' active':''}" onclick="selTopic('${t.id}')">${t.label}</button>`
  ).join('');
}
function selTopic(id){S.topic=id;buildTabs();resetQuiz();startQuiz();}
function setDiff(d){
  S.diff=d;
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.dbtn.'+d).classList.add('active');
  if(document.getElementById('quizArea').style.display!=='none'){resetQuiz();startQuiz();}
}
function nextDiff(){
  const order=['easy','medium','hard'];
  const i=order.indexOf(S.diff);
  if(i<2) setDiff(order[i+1]); else restartQuiz();
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function resetQuiz(){S.correct=0;S.wrong=0;S.streak=0;S.idx=0;S.answered=false;clearInterval(S.timer);}

function startQuiz(){
  const pool=BANK[S.topic]&&BANK[S.topic][S.diff];
  if(!pool||!pool.length){alert('Questions coming soon for this topic!');return;}
  S.qs=shuffle(pool).slice(0,10);
  S.correct=0;S.wrong=0;S.streak=0;S.idx=0;
  document.getElementById('welcomeScreen').style.display='none';
  document.getElementById('compScreen').classList.remove('show');
  document.getElementById('quizArea').style.display='block';
  document.getElementById('progWrap').style.display='flex';
  renderQ();updateStats();
}

function renderQ(){
  if(S.idx>=S.qs.length){showCompletion();return;}
  const q=S.qs[S.idx];S.answered=false;
  document.getElementById('qnum').textContent=`Q${S.idx+1}/10`;
  const chips={easy:'chip-e',medium:'chip-m',hard:'chip-h'};
  const chipEl=document.getElementById('dchip');
  chipEl.className='dchip '+chips[S.diff];
  chipEl.textContent={easy:'Easy',medium:'Medium',hard:'Hard'}[S.diff];
  const card=document.getElementById('qcard');
  card.className='qcard '+S.diff;
  document.getElementById('qtxt').innerHTML=q.q;
  document.getElementById('ansArea').innerHTML=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" id="o${i}" onclick="pick(${i})"><span class="oletter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>`;
  const fb=document.getElementById('fb');fb.className='fb';
  document.getElementById('nbtn').className='nbtn';
  const p=S.idx/S.qs.length*100;
  document.getElementById('progBar').style.width=p+'%';
  document.getElementById('progTxt').textContent=`${S.idx}/10`;
  document.getElementById('streakN').textContent=S.streak;
  updateStats();
  renderMath();
  startTimer();
}

function renderMath(){
  setTimeout(()=>{
    if(window.renderMathInElement){
      renderMathInElement(document.getElementById('quizArea'),{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});
    }
  },40);
}

function startTimer(){
  clearInterval(S.timer);
  S.timeLeft=S.diff==='hard'?90:S.diff==='medium'?75:60;
  updTimer();
  S.timer=setInterval(()=>{
    S.timeLeft--;updTimer();
    if(S.timeLeft<=0){clearInterval(S.timer);if(!S.answered)timeout();}
  },1000);
}
function updTimer(){
  const el=document.getElementById('timer');
  const t=S.timeLeft;
  document.getElementById('timerN').textContent=t;
  el.className='timer'+(t<=10?' danger':t<=20?' warn':'');
}
function timeout(){
  S.answered=true;
  const q=S.qs[S.idx];
  S.wrong++;S.tw++;S.streak=0;saveStats();updateStats();
  showFB(false,q);
  document.getElementById('nbtn').className='nbtn show';
}

function pick(i){
  if(S.answered)return;
  S.answered=true;clearInterval(S.timer);
  const q=S.qs[S.idx];
  const ok=i===q.answer;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  document.getElementById('o'+i).classList.add(ok?'correct':'wrong');
  if(!ok)document.getElementById('o'+q.answer).classList.add('correct');
  if(ok){S.correct++;S.tc++;S.streak++;doFlash('g');}
  else{S.wrong++;S.tw++;S.streak=0;doFlash('r');}
  saveStats();updateStats();showFB(ok,q);
  document.getElementById('nbtn').className='nbtn show';
}

function showFB(ok,q){
  const fb=document.getElementById('fb');
  fb.className='fb show '+(ok?'cfb':'wfb');
  document.getElementById('fbtitle').innerHTML=ok?'✅ Correct!':'❌ Incorrect — correct answer: <strong>'+q.opts[q.answer]+'</strong>';
  document.getElementById('sol').innerHTML='<strong>Working:</strong><br>'+q.steps.map(s=>`<div class="step">${s}</div>`).join('');
  setTimeout(()=>{
    if(window.renderMathInElement)renderMathInElement(fb,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});
  },40);
}

function nextQ(){S.idx++;renderQ();}

function updateStats(){
  const tot=S.correct+S.wrong;
  document.getElementById('sC').textContent=S.tc;
  document.getElementById('sW').textContent=S.tw;
  document.getElementById('sP').textContent=tot?Math.round(S.correct/tot*100)+'%':'—';
  document.getElementById('sinfo').textContent=`${S.correct}/${tot} this set`;
}

function doFlash(c){
  const el=document.getElementById('flash');
  el.className='flash '+c+' on';
  setTimeout(()=>el.className='flash '+c,300);
}

function showCompletion(){
  clearInterval(S.timer);
  document.getElementById('quizArea').style.display='none';
  document.getElementById('progWrap').style.display='none';
  const pct=Math.round(S.correct/10*100);
  const stars=pct>=80?3:pct>=60?2:1;
  const icons=['📚','🥈','🏆'];
  const msgs={3:'Outstanding! Full marks territory! 🏆',2:'Good work — almost there!',1:'Keep practising — you\'ll get it!'};
  document.getElementById('compIcon').textContent=icons[stars-1];
  document.getElementById('compScore').textContent=`${S.correct}/10`;
  document.getElementById('compSub').textContent=`${pct}% · ${TOPICS.find(t=>t.id===S.topic).label} · ${S.diff.charAt(0).toUpperCase()+S.diff.slice(1)}`;
  document.getElementById('compStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
  document.getElementById('compMsg').textContent=msgs[stars];
  document.getElementById('compScreen').classList.add('show');
}
function restartQuiz(){document.getElementById('compScreen').classList.remove('show');startQuiz();}

function appInit(){
  loadStats();buildTabs();updateStats();
  renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});
}
</script>
</body>
</html>
